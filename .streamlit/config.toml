# Streamlit server configuration.
#
# `address = "0.0.0.0"` is what makes the app reachable from outside the
# container. Without it Streamlit binds to localhost and a deployed instance
# refuses every connection, which looks identical to "the deploy is broken".

[server]
address = "0.0.0.0"
headless = true
port = 8501
maxUploadSize = 5

# NOTE: `enableCORS = false` is deliberately NOT set. Streamlit treats it as
# incompatible with `enableXsrfProtection = true` and silently overrides it back
# to true, printing a warning at startup — so writing it here would be a comment
# that lies. Render proxies the app at the same origin and path, so Streamlit's
# defaults work unchanged. If a CSRF error ever appears behind a proxy, the
# documented fix is to set `enableXsrfProtection = false` (not CORS) so the two
# agree.

[browser]
gatherUsageStats = false

[theme]
primaryColor = "#0f766e"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f0fdfa"
textColor = "#0f172a"
